<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자</title><style>:root{color-scheme:light dark;--b:#d9d9e0;--m:#6b6b7a}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:24px 16px}main{max-width:640px;margin:0 auto}h1{font-size:22px}input,textarea,select,button{font:inherit;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:transparent;color:inherit;width:100%}button{width:auto;cursor:pointer;background:#111;color:#fff;border-color:#111}button.dg{background:transparent;color:#e5484d;border-color:#e5484d}@media(prefers-color-scheme:dark){button{background:#fff;color:#111;border-color:#fff}}form{display:grid;gap:10px;margin:16px 0}#msg{min-height:1.5em;color:var(--m)}#msg.bad{color:#e5484d}ul{list-style:none;padding:0;display:grid;gap:8px}li{display:flex;gap:8px;align-items:center;border:1px solid var(--b);border-radius:10px;padding:8px 10px}li span{flex:1;min-width:0;overflow-wrap:anywhere}li button{padding:6px 10px}[hidden]{display:none!important}.row{display:flex;gap:8px}</style></head><body><main><h1>관리자</h1><p id="msg"></p><section id="login"><form id="lf"><input id="em" type="email" placeholder="이메일" autocomplete="username" required><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required><button type="submit">로그인</button></form></section><section id="panel" hidden><div class="row"><button id="out" type="button" class="dg">로그아웃</button></div><form id="pf"><select id="bd" aria-label="게시판"><option>profile</option><option>gallery</option></select><input id="ti" placeholder="제목" maxlength="200" required><input id="ca" placeholder="카테고리 (선택)" maxlength="40"><textarea id="bo" rows="8" placeholder="내용"></textarea><input id="im" type="url" placeholder="이미지 주소 (선택, https://…)"><input id="fl" type="file" accept="image/*" multiple aria-label="사진 올리기"><p style="margin:0;font-size:13px;color:var(--m)">사진을 고르면 바로 올라가요. 한 장이면 위 이미지 칸에 채워지고, 여러 장이면 한 장당 글 하나로 올라가요.</p><div class="row"><button id="go" type="submit">글 올리기</button><button id="cx" type="button" class="dg" hidden>수정 취소</button></div></form><h2 style="font-size:17px">올린 글</h2><ul id="ls"></ul></section></main><script src="js/config.js"></script><script>(function(){
 var C=window.NJ_CONFIG||{},q=function(s){return document.querySelector(s)},tok=null,editId=null,base=(C.url||'').replace(/\/+$/,'');
 try{tok=sessionStorage.getItem('nj_tok')}catch(e){}
 function hd(x){var h={apikey:C.key,'Content-Type':'application/json'};h.Authorization='Bearer '+(tok||(/^eyJ/.test(C.key)?C.key:''));if(!tok&&!/^eyJ/.test(C.key))delete h.Authorization;for(var k in x)h[k]=x[k];return h}
 function say(t,bad){var m=q('#msg');m.textContent=t||'';m.className=bad?'bad':''}
 function show(){q('#login').hidden=!!tok;q('#panel').hidden=!tok;if(tok)load()}
 function fail(r){if(r.status===401||r.status===403){say('권한이 없어요. 로그인 이메일이 SQL에 넣은 관리자 이메일과 같은지 확인하세요.',1);if(r.status===401){tok=null;try{sessionStorage.removeItem('nj_tok')}catch(e){}show()}}else say('요청에 실패했어요 ('+r.status+')',1)}
 q('#lf').onsubmit=function(e){e.preventDefault();say('로그인 중…');
  fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify({email:q('#em').value.trim(),password:q('#pw').value})}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(o){
   if(!o.ok||!o.j.access_token){say('로그인에 실패했어요. 이메일과 비밀번호를 확인하세요.',1);return}
   tok=o.j.access_token;try{sessionStorage.setItem('nj_tok',tok)}catch(e){}q('#pw').value='';say('');show()}).catch(function(){say('연결할 수 없어요. 주소와 키를 확인하세요.',1)})};
 q('#out').onclick=function(){tok=null;try{sessionStorage.removeItem('nj_tok')}catch(e){}show()};
 function reset(){editId=null;q('#ti').value='';q('#bo').value='';q('#im').value='';q('#ca').value='';q('#go').textContent='글 올리기';q('#cx').hidden=true}
 q('#cx').onclick=reset;
function shrink(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var m=1600,w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej()},'image/jpeg',.85)};im.onerror=function(){rej()};im.src=u})}
 function up(f){return shrink(f).then(function(b){var nm=Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.jpg';return fetch(base+'/storage/v1/object/photos/'+nm,{method:'POST',headers:{apikey:C.key,Authorization:'Bearer '+tok,'Content-Type':'image/jpeg'},body:b}).then(function(r){if(!r.ok){if(r.status===401||r.status===403)fail(r);else say('사진 올리기에 실패했어요 ('+r.status+'). supabase.sql을 다시 실행했는지 확인하세요.',1);throw 0}return base+'/storage/v1/object/public/photos/'+nm})},function(){say('이 사진은 읽을 수 없어요.',1);throw 0})}
 var fl=q('#fl');if(fl)fl.onchange=function(){var fs=Array.prototype.slice.call(fl.files||[]);fl.value='';if(!fs.length)return;
  if(fs.length===1){say('올리는 중…');up(fs[0]).then(function(u){q('#im').value=u;if(!q('#ti').value.trim())q('#ti').value=fs[0].name.replace(/\.[^.]+$/,'').slice(0,200);say('사진을 올렸어요. 글 올리기를 눌러 마무리하세요.')},function(){});return}
  var n=0;fs.reduce(function(p,f,i){return p.then(function(){say('올리는 중… '+(i+1)+'/'+fs.length);return up(f).then(function(u){return fetch(base+'/rest/v1/posts',{method:'POST',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify({board:q('#bd').value,title:f.name.replace(/\.[^.]+$/,'').slice(0,200)||'photo',body:'',image:u,category:q('#ca').value.trim()||null})}).then(function(r){if(!r.ok){fail(r);throw 0}n++})})})},Promise.resolve()).then(function(){say(n+'장을 올렸어요');load()},function(){if(n)load()})};
 q('#pf').onsubmit=function(e){e.preventDefault();var body={board:q('#bd').value,title:q('#ti').value.trim(),body:q('#bo').value,image:q('#im').value.trim()||null,category:q('#ca').value.trim()||null};if(!body.title)return;
  var url=base+'/rest/v1/posts'+(editId?'?id=eq.'+editId:'');
  fetch(url,{method:editId?'PATCH':'POST',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify(body)}).then(function(r){if(!r.ok){fail(r);return}say(editId?'수정했어요':'올렸어요');reset();load()})};
 function load(){fetch(base+'/rest/v1/posts?select=*&order=created_at.desc&limit=100',{headers:hd()}).then(function(r){if(!r.ok){fail(r);return null}return r.json()}).then(function(rows){
   if(!rows)return;var ul=q('#ls');ul.textContent='';if(!rows.length){ul.textContent='아직 글이 없어요.';return}
   rows.forEach(function(p){var li=document.createElement('li'),sp=document.createElement('span'),a=document.createElement('button'),b=document.createElement('button');
    sp.textContent='['+p.board+'] '+p.title+' · '+new Date(p.created_at).toLocaleDateString('ko-KR');a.textContent='수정';b.textContent='삭제';b.className='dg';
    a.onclick=function(){editId=p.id;q('#bd').value=p.board;q('#ti').value=p.title;q('#bo').value=p.body||'';q('#im').value=p.image||'';q('#ca').value=p.category||'';q('#go').textContent='수정 저장';q('#cx').hidden=false;window.scrollTo(0,0)};
    b.onclick=function(){if(!confirm('이 글을 삭제할까요?'))return;fetch(base+'/rest/v1/posts?id=eq.'+p.id,{method:'DELETE',headers:hd()}).then(function(r){if(!r.ok){fail(r);return}say('삭제했어요');load()})};
    li.appendChild(sp);li.appendChild(a);li.appendChild(b);ul.appendChild(li)})})}
 if(!C.url||!C.key){say('js/config.js에 Supabase 주소와 키가 비어 있어요.',1)}
 show();
})();</script></body></html>
